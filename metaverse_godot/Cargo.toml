[package]
name = "metaverse_godot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Compile this crate to a dynamic C library.

[dependencies]
actix = "0.13.5"
actix-rt = "2.10.0"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.14"
godot = "0.2.3"
log = "0.4.26"

metaverse_messages = {path = "../../metaverse_client/crates/messages/"}
metaverse_core = {path = "../../metaverse_client/crates/core/"}
portpicker = "0.1.1"
tempfile = "3.17.1"
tokio = { version = "1.14.0", features = ["full"] }
serde_json = "1.0.149"
